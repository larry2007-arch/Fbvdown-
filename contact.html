<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - FBVDOWN.com.ng</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>
<body>

    <header>
        <a href="index.html">
            <img src="lo.png" alt="FBVDOWN Logo">
            <div>FBVDOWN<span>.com.ng</span></div>
        </a>

        <div aria-label="Toggle Navigation">
            <a href="index.html"><span>Home</span></a>
            <a href="use.html"><span>How to use</span></a>
            <a href="chrome.html"><span>Chrome extension</span></a>
        </div>
    </header>

    <main>
        <img src="lo.png" alt="FBVDOWN Logo">
        <h1>FBVDOWN<span>.com.ng</span></h1>
        <div>Facebook Video Downloader</div>
        
        <h2>Contact us</h2>

        <!-- Contact Form -->
        <form id="contactForm" style="max-width: 500px; margin: 20px auto; text-align: left;">
            <div style="margin-bottom: 15px;">
                <label for="user_email" style="display: block; margin-bottom: 5px;">Your Email:</label>
                <input type="email" id="user_email" name="user_email" placeholder="name@example.com" required style="width: 100%; padding: 10px; box-sizing: border-box;">
            </div>

            <div style="margin-bottom: 15px;">
                <label for="subject" style="display: block; margin-bottom: 5px;">Subject:</label>
                <input type="text" id="subject" name="subject" placeholder="Subject" required style="width: 100%; padding: 10px; box-sizing: border-box;">
            </div>

            <div style="margin-bottom: 15px;">
                <label for="message" style="display: block; margin-bottom: 5px;">Message:</label>
                <textarea id="message" name="message" rows="5" placeholder="Write your message here..." required style="width: 100%; padding: 10px; box-sizing: border-box;"></textarea>
            </div>

            <button type="submit" id="submitBtn" style="padding: 10px 20px; cursor: pointer;">Send Message</button>
            <p id="formStatus" style="margin-top: 10px; font-weight: bold;"></p>
        </form>
    </main>

    <footer>
        <p>© 2026 <a href="https://fbvdown.com.ng">FBVDOWN.com.ng</a>. All rights reserved.</p>
    </footer>

    <!-- Form Handling Script -->
    <script>
        document.getElementById('contactForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const submitBtn = document.getElementById('submitBtn');
            const status = document.getElementById('formStatus');

            const email = document.getElementById('user_email').value;
            const subject = document.getElementById('subject').value;
            const message = document.getElementById('message').value;

            submitBtn.disabled = true;
            status.style.color = '#333';
            status.textContent = 'Sending message...';

            try {
                // Change '/api/send-contact' to match your actual server route or file path
                const response = await fetch('/api/send-contact', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ email, subject, message })
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    status.style.color = 'green';
                    status.textContent = 'Thank you! Your message has been sent successfully.';
                    document.getElementById('contactForm').reset();
                } else {
                    status.style.color = 'red';
                    status.textContent = result.message || 'Failed to send message. Please try again.';
                }
            } catch (error) {
                status.style.color = 'red';
                status.textContent = 'Network error. Please try again later.';
            } finally {
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
    </html>
